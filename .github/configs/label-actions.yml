'Status: Fixed':
  issues:
    close: true
    close-reason: completed
    unlabel:
      - 'Status: Accepted'
      - 'Status: Awaiting PR'
      - 'Status: Duplicate'
      - 'Status: Pending...'
      - 'Status: Planned'
      - 'Status: Rejected'
      - 'Status: Reproduced Bug'
      - 'Status: Requires Changes'
      - 'Status: Stale'

'Status: Accepted':
  prs:
    close: true
    close-reason: completed
    unlabel:
      - 'Status: Fixed'
      - 'Status: Awaiting PR'
      - 'Status: Duplicate'
      - 'Status: Pending...'

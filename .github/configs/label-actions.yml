      - 'Status: Stale'

'Status: Awaiting PR':
  issues:
    reopen: true
    unlabel:
      - 'Status: Fixed'
      - 'Status: Accepted'
      - 'Status: Duplicate'
      - 'Status: Pending...'
      - 'Status: Planned'
      - 'Status: Rejected'
      - 'Status: Reproduced Bug'
      - 'Status: Requires Changes'
      - 'Status: Stale'

      # TilNotDrip Anti-Cheat

      - 'Trophy: First *EVER* completed issue'
      - 'Trophy: First completed issue'

'Status: Duplicate':
